{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 15px;">
    <h2>Registrati</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Scegli un Username" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <input type="password" name="password" placeholder="Crea una Password" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <button type="submit" style="width: 100%; background: #22c55e; color: white; padding: 10px; border: none; border-radius: 5px;">Crea Account</button>
    </form>
</div>
{% endblock %}
